name: Send Code Review Report

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/send-review-report.yml'

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send via Vercel production API
        run: |
          curl -s -X POST 'https://flashauto.vercel.app/api/notify-telegram?test=1' \
            -H 'Content-Type: application/json' \
            -d '{"message": "🔍 コードレビュー報告（2026-06-05）\n\n【致命的】\n\n1. api/notify-telegram.js:28-36\nCRON_SECRET未設定時は認証を完全スキップ。?test=1クエリでTelegram送信が認証なしで可能。対策: CRON_SECRET未設定時は500を返すか必須化。\n\n2. api/post-x.js:38-44 / api/daily-report.js:33-39\n同様にCRON_SECRET未設定時は認証スキップ。本番で未設定のまま運用すると任意リクエストでX投稿・レポート送信が実行される。対策: 同上。\n\n3. vite.config.js (handleTrackProxy)\nローカル開発のCORSが Access-Control-Allow-Origin: * で本番制限と真逆。対策: localhost:5173 のみ許可する。\n\n【改善推奨】\n\n4. api/deck-cache.js:632-684 (consumeCredit)\n競合状態でクレジット二重消費の可能性。対策: Supabase RPCでアトミック処理に変更。\n\n5. api/daily-report.js:140-148\neventsをLIMIT(5000)全取得後かJSフィルタ。5000件超でデータ欠落。対策: .gte(occurred_at, todayStart)をSupabaseクエリに追加。\n\n6. src/api.js:156-163 (aiEval)\nプロンプトインジェクションリスク。対策: 埋め込み前に200文字にslice。\n\n7. api/public-library.js:116\nsource_deck_idがnull時にupsertはonConflictの照合が機能せずNULL!=NULLで重複INSERT可能性。\n\n【軽微】\n\n8. vite.config.js (parseDeckPayload)\napi/deck-cache.jsと同等の関数が重複実装。古いバージョン（<think>除去なし）。\n\n9. src/App.jsx:327\nwindow.confirm()による削除確認。モバイルブラウザでブロックされる場合がある。\n\n10. api/daily-report.js:225\nGoogle Sheets IDがハードコード。\n\n---\n📊 分析ファイル数: 30件"}'
          echo "Exit code: $?"
